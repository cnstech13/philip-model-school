<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    
    <meta name="theme-color" content="lightblue">

    <title>Parent Registration | Philip Model School</title>

    <link
        rel="stylesheet"
        href="parent-register.css"
    >

</head>


<body>


<div class="register-container">


    <div class="register-card">


        <!-- HEADER -->

        <div class="register-header">

            <div class="school-logo">
                PMS
            </div>

            <h1>
                Parent Registration
            </h1>

            <p>
                Philip Model School
            </p>

        </div>



        <!-- FORM -->

        <form id="parentRegisterForm">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter the email used by the school"
                    required
                >

                <small>
                    Use the same email address you provided to the school.
                </small>

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>



            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>



            <!-- ERROR -->

            <div
                id="errorMessage"
                class="message error-message"
            ></div>



            <!-- SUCCESS -->

            <div
                id="successMessage"
                class="message success-message"
            ></div>



            <button
                type="submit"
                id="registerBtn"
            >
                Create Parent Account
            </button>


        </form>



        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="parent-login.html">
                Login here
            </a>

        </div>


    </div>


</div>


<script
    type="module"
    src="parent-register.js"
></script>


</body>

</html>
