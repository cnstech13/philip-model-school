<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    
    <meta name="theme-color" content="#8098ff">

    <title>
        Parent Dashboard | Philip Model School
    </title>

    <link
        rel="stylesheet"
        href="parent-dashboard.css"
    >

</head>

<body>


<header class="topbar">

    <div>

        <h1>
            Parent Portal
        </h1>

        <p>
            Philip Model School
        </p>

    </div>


    <button id="logoutBtn">
        Logout
    </button>

</header>



<main class="dashboard-container">


    <!-- =====================================================
         WELCOME
         ===================================================== -->

    <section class="welcome-card">

        <div>

            <h2 id="welcomeText">
                Welcome, Parent
            </h2>

            <p id="parentEmail">
                Loading...
            </p>

        </div>

    </section>



    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="errorMessage"
        class="error-message"
    ></div>



    <!-- =====================================================
         CHILDREN
         ===================================================== -->

    <section>

        <div class="section-heading">

            <h2>
                My Children
            </h2>

            <span id="childrenCount">
                0
            </span>

        </div>


        <div
            id="childrenContainer"
            class="children-grid"
        >

            <div class="loading">
                Loading children's records...
            </div>

        </div>

    </section>



<section class="services">

    <h2>
        Parent Services
    </h2>


    <div class="services-grid">


        <button
            type="button"
            class="service-card"
            data-service="results"
        >

            <span class="service-icon">
                📊
            </span>

            <strong>
                Results
            </strong>

            <small>
                View academic results
            </small>

        </button>



        <button
            type="button"
            class="service-card"
            data-service="attendance"
        >

            <span class="service-icon">
                📅
            </span>

            <strong>
                Attendance
            </strong>

            <small>
                View attendance records
            </small>

        </button>



        <button
            type="button"
            class="service-card"
            data-service="fees"
        >

            <span class="service-icon">
                💰
            </span>

            <strong>
                Fees
            </strong>

            <small>
                View school fees
            </small>

        </button>



        <button
            type="button"
            class="service-card"
            data-service="reportCards"
        >

            <span class="service-icon">
                📄
            </span>

            <strong>
                Report Cards
            </strong>

            <small>
                View report cards
            </small>

        </button>


    </div>

</section>

</main>



<script
    type="module"
    src="parent-dashboard.js"
></script>

</body>

</html>
